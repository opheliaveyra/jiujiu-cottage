<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 820" role="img" aria-labelledby="t d">
<title id="t">玖玖の小屋，一间藏着月光与作品的插画工作室</title>
<desc id="d">拱形窗外是紫粉色黄昏，窗边有猫、书、电脑、花和一封信。</desc>
<defs>
  <linearGradient id="arch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf3ec"/><stop offset=".6" stop-color="#e9d6da"/><stop offset="1" stop-color="#c9aed1"/></linearGradient>
  <linearGradient id="sky" x1="0" x2=".7" y1="0" y2="1"><stop stop-color="#61537c"/><stop offset=".46" stop-color="#a181ab"/><stop offset="1" stop-color="#efbebf"/></linearGradient>
  <linearGradient id="hills" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#a4a0b8"/><stop offset="1" stop-color="#777999"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#e7baa6"/><stop offset=".6" stop-color="#c89491"/><stop offset="1" stop-color="#a77d90"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a1a2ca"/><stop offset=".45" stop-color="#6c6b9c"/><stop offset="1" stop-color="#3d426b"/></linearGradient>
  <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f0"/><stop offset="1" stop-color="#e3c8d1"/></linearGradient>
  <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5df"/><stop offset="1" stop-color="#e7bcb3"/></linearGradient>
  <radialGradient id="moon"><stop stop-color="#fff8e5"/><stop offset=".6" stop-color="#ffedde"/><stop offset="1" stop-color="#f1d5d9"/></radialGradient>
  <radialGradient id="aura"><stop stop-color="#ffe7e0" stop-opacity=".56"/><stop offset="1" stop-color="#f2d8ed" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="21" flood-color="#594363" flood-opacity=".24"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  <clipPath id="window"><path d="M226 550 V214 C226 82 341 35 508 34 C683 34 794 91 794 214 V550 Z"/></clipPath>
  <pattern id="stars" width="102" height="87" patternUnits="userSpaceOnUse"><circle cx="16" cy="22" r="1.5" fill="#fff1de" opacity=".8"/><path d="M67 58v11m-5.5-5.5h11" stroke="#fff0df" stroke-width="1.3" opacity=".5"/></pattern>
</defs>
