name: Build Jiujiu 3D Room Preview

on:
  push:
    branches:
      - feature/jiujiu-room-folio
    paths:
      - "room-lab/**"
      - ".github/workflows/room-preview.yml"
  workflow_dispatch:

concurrency:
  group: jiujiu-3d-room-preview
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout the isolated design branch
        uses: actions/checkout@v4
        with:
          ref: feature/jiujiu-room-folio
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch original Three.js portfolio
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/andrewwoan/sooahs-room-folio.git .room-upstream
          cd .room-upstream
          git sparse-checkout set src public
      - name: Apply 玖玖-specific content and UI
        run: node room-lab/build.mjs
      - name: Install dependencies
        working-directory: .room-upstream
        run: npm ci --no-audit --no-fund
      - name: Build static site
        working-directory: .room-upstream
        run: npm run build
      - name: Prepare preinstalled browser for layout checks
        working-directory: .room-upstream
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          which google-chrome
          google-chrome --version
      - name: Verify interactive scene on desktop and phone
        continue-on-error: true
        run: |
          cp room-lab/smoke.cjs .room-upstream/smoke.cjs
          cd .room-upstream
          npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          timeout 130s node smoke.cjs
      - name: Preserve screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiujiu-room-visual-qa
          path: .room-upstream/qa/
          retention-days: 7
      - name: Copy built site into preview directory
        run: |
          rm -rf room-preview
          mkdir -p room-preview
          cp -a .room-upstream/dist/. room-preview/
          cp .room-upstream/LICENSE.md room-preview/LICENSE-UPSTREAM.md
          if test -f .room-upstream/qa/report.json; then cp .room-upstream/qa/report.json room-preview/QA-REPORT.json; else printf '%s\n' '{"status":"qa_unavailable","note":"Browser smoke test did not complete"}' > room-preview/QA-REPORT.json; fi
          test -f room-preview/index.html
          test -f room-preview/models/Room_Portfolio.glb
          grep -q '玖玖の小屋' room-preview/index.html
          printf '%s\n' 'Prototype generated using upstream Sooah Room Folio, copyright 2025 Andrew Woan. Keep MIT attribution and review scene art assets before release.' > room-preview/SOURCE-CREDITS.txt
      - name: Publish to this branch only, not main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A room-preview
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: publish standalone Three.js room preview"
          git fetch origin feature/jiujiu-room-folio
          git rebase origin/feature/jiujiu-room-folio
          git push origin HEAD:feature/jiujiu-room-folio
