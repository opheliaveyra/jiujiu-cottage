<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玖玖の魔法小屋 · 00024号</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Noto+Serif+SC:wght@300;400;700&family=Dancing+Script:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #07041a;
      --bg-mid:     #120828;
      --pink:       #ff9ed2;
      --pink-pale:  #ffd6ec;
      --gold:       #ffd54f;
      --gold-pale:  #fff59d;
      --purple:     #ce93d8;
      --purple-deep:#9c4dcc;
      --lavender:   #e1bee7;
      --white:      #ffffff;
      --starglow:   rgba(255,213,79,0.6);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: 'Noto Serif SC', serif;
      cursor: none;
    }

    /* ── 自定义光标 ── */
    #cursor {
      position: fixed; top: 0; left: 0;
      width: 18px; height: 18px;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
    }
    #cursor::before {
      content: '✦';
      font-size: 18px;
      color: var(--gold);
      text-shadow: 0 0 8px var(--gold), 0 0 16px var(--pink);
      display: block;
      animation: cursorSpin 3s linear infinite;
    }
    @keyframes cursorSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── 星空画布 ── */
    #starfield {
      position: fixed; inset: 0;
      z-index: 0;
    }

    /* ── 粒子画布 ── */
    #particles {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ── 渐变晕染 ── */
    .aurora {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 30%, rgba(156,77,204,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 70%, rgba(255,158,210,0.14) 0%, transparent 70%),
        radial-gradient(ellipse 70% 50% at 50% 90%, rgba(26,5,51,0.8) 0%, transparent 80%);
      pointer-events: none;
    }

    /* ── 主容器 ── */
    .stage {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10;
    }

    /* ── 顶部副标题 ── */
    .sub-title {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(0.75rem, 2vw, 1rem);
      color: var(--pink-pale);
      letter-spacing: 0.25em;
      opacity: 0.75;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 12px var(--pink);
      animation: fadeFloat 6s ease-in-out infinite;
    }
    @keyframes fadeFloat {
      0%,100% { opacity: 0.65; transform: translateY(0); }
      50%      { opacity: 0.95; transform: translateY(-4px); }
    }

    /* ── 魔法阵 ── */
    .magic-circle-wrap {
      position: relative;
      width: clamp(240px, 44vmin, 420px);
      height: clamp(240px, 44vmin, 420px);
      display: flex; align-items: center; justify-content: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid;
    }
    .ring-1 {
      border-color: rgba(255,213,79,0.55);
      animation: spinCW 18s linear infinite;
      box-shadow: 0 0 10px rgba(255,213,79,0.25), inset 0 0 10px rgba(255,213,79,0.1);
    }
    .ring-2 {
      inset: 10px;
      border-color: rgba(255,158,210,0.45);
      animation: spinCCW 24s linear infinite;
    }
    .ring-3 {
      inset: 22px;
      border-color: rgba(206,147,216,0.4);
      border-style: dashed;
      animation: spinCW 32s linear infinite;
    }
    @keyframes spinCW  { to { transform: rotate(360deg);  } }
    @keyframes spinCCW { to { transform: rotate(-360deg); } }

    /* 八角星顶点 */
    .ring-1::before, .ring-1::after,
    .ring-2::before, .ring-2::after {
      content: '◆';
      position: absolute;
      font-size: 7px;
      color: var(--gold);
      text-shadow: 0 0 6px var(--gold);
    }
    .ring-1::before { top: -5px;  left: 50%; transform: translateX(-50%); }
    .ring-1::after  { bottom: -5px; left: 50%; transform: translateX(-50%); }
    .ring-2::before { top: 50%; right: -5px; transform: translateY(-50%); }
    .ring-2::after  { top: 50%; left: -5px; transform: translateY(-50%); }

    /* SVG 魔法阵底图 */
    .rune-svg {
      position: absolute;
      inset: 28px;
      opacity: 0.18;
      animation: spinCW 60s linear infinite;
    }

    /* ── 中央按钮入口 ── */
    .enter-btn {
      position: relative; z-index: 20;
      width: clamp(100px, 18vmin, 160px);
      height: clamp(100px, 18vmin, 160px);
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 40% 35%,
        rgba(255,213,79,0.22) 0%,
        rgba(206,147,216,0.15) 45%,
        rgba(7,4,26,0.85) 100%);
      cursor: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      box-shadow:
        0 0 24px rgba(255,213,79,0.35),
        0 0 60px rgba(206,147,216,0.2),
        inset 0 0 20px rgba(255,213,79,0.1);
      transition: box-shadow 0.4s, transform 0.4s;
      outline: none;
    }
    .enter-btn:hover {
      box-shadow:
        0 0 40px rgba(255,213,79,0.6),
        0 0 90px rgba(255,158,210,0.35),
        inset 0 0 30px rgba(255,213,79,0.2);
      transform: scale(1.07);
    }
    .enter-btn:hover .btn-star { animation-play-state: paused; transform: scale(1.3); }
    .btn-star {
      font-size: clamp(1.4rem, 4vmin, 2rem);
      animation: btnPulse 2.5s ease-in-out infinite;
      transition: transform 0.3s;
      filter: drop-shadow(0 0 6px var(--gold));
    }
    .btn-label {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(0.45rem, 1.2vmin, 0.65rem);
      color: var(--gold-pale);
      letter-spacing: 0.15em;
      text-shadow: 0 0 8px var(--gold);
      white-space: nowrap;
    }
    @keyframes btnPulse {
      0%,100% { opacity: 1; filter: drop-shadow(0 0 6px var(--gold)); }
      50%      { opacity: 0.7; filter: drop-shadow(0 0 14px var(--gold)); }
    }

    /* ── 导航卡片环绕 ── */
    .nav-ring {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .nav-item {
      position: absolute;
      pointer-events: all;
      transform: translate(-50%, -50%);
    }
    .nav-card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 4px;
      width: clamp(60px, 11vmin, 90px);
      height: clamp(60px, 11vmin, 90px);
      border-radius: 50%;
      border: 1px solid rgba(255,213,79,0.3);
      background: radial-gradient(circle at 40% 35%,
        rgba(255,255,255,0.06) 0%,
        rgba(7,4,26,0.7) 100%);
      text-decoration: none;
      cursor: none;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1),
                  box-shadow 0.35s, border-color 0.35s;
      box-shadow: 0 0 10px rgba(255,213,79,0.1);
    }
    .nav-card:hover {
      transform: scale(1.2);
      border-color: rgba(255,213,79,0.75);
      box-shadow: 0 0 22px rgba(255,213,79,0.45), 0 0 50px rgba(255,158,210,0.25);
    }
    .nav-icon {
      font-size: clamp(1rem, 3vmin, 1.5rem);
      filter: drop-shadow(0 0 5px currentColor);
      transition: transform 0.3s;
    }
    .nav-card:hover .nav-icon { transform: scale(1.25) rotate(-10deg); }
    .nav-label {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(0.5rem, 1.3vmin, 0.7rem);
      color: var(--pink-pale);
      text-shadow: 0 0 6px var(--pink);
      white-space: nowrap;
    }

    /* ── 底部签名 ── */
    .signature {
      margin-top: 2.5rem;
      text-align: center;
    }
    .main-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1rem, 3.5vw, 1.8rem);
      background: linear-gradient(135deg, var(--gold-pale) 0%, var(--pink) 50%, var(--purple) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.08em;
      text-shadow: none;
      position: relative;
    }
    .main-title::after {
      content: attr(data-text);
      position: absolute; left: 0; top: 0;
      background: linear-gradient(135deg, var(--gold-pale), var(--pink), var(--purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(8px);
      opacity: 0.5;
      z-index: -1;
    }
    .deco-line {
      margin: 0.6rem auto;
      display: flex; align-items: center; justify-content: center;
      gap: 0.4rem;
      color: rgba(255,213,79,0.5);
      font-size: 0.6rem;
      letter-spacing: 0.5em;
    }
    .room-no {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(0.65rem, 1.8vw, 0.9rem);
      color: rgba(255,214,228,0.6);
      letter-spacing: 0.3em;
    }
    .icp-no {
      position: fixed;
      right: 1.1rem;
      bottom: 0.9rem;
      z-index: 10;
      margin: 0;
      font-family: 'Noto Serif SC', serif;
      font-size: 0.68rem;
      letter-spacing: 0.35em;
      color: rgba(255,213,79,0.45);
    }
    .icp-no a {
      color: rgba(255,214,228,0.55);
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .icp-no a:hover {
      color: #ffd54f;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* ── 四角装饰 ── */
    .corner {
      position: fixed;
      width: clamp(60px, 10vw, 110px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 5;
    }
    .corner-tl { top: 0;    left: 0;  }
    .corner-tr { top: 0;    right: 0; transform: scaleX(-1); }
    .corner-bl { bottom: 0; left: 0;  transform: scaleY(-1); }
    .corner-br { bottom: 0; right: 0; transform: scale(-1); }

    /* ── 散落星星 ── */
    .floaty {
      position: fixed;
      pointer-events: none;
      z-index: 4;
      font-size: 0.7rem;
      color: var(--gold);
      text-shadow: 0 0 6px var(--gold);
      animation: floatyStar 8s ease-in-out infinite;
    }
    @keyframes floatyStar {
      0%,100% { transform: translateY(0) rotate(0deg);   opacity: 0.5; }
      33%      { transform: translateY(-12px) rotate(45deg); opacity: 0.9; }
      66%      { transform: translateY(6px) rotate(-20deg);  opacity: 0.6; }
    }

    /* ── 入场动画 ── */
    .fade-in {
      animation: fadeInUp 1.2s cubic-bezier(0.16,1,0.3,1) both;
    }
    .fade-in-delay-1 { animation-delay: 0.3s; }
    .fade-in-delay-2 { animation-delay: 0.6s; }
    .fade-in-delay-3 { animation-delay: 0.9s; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 全屏闪光遮罩 ── */
    #flash {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center,
        rgba(255,245,200,1) 0%, rgba(255,200,230,0.8) 40%, transparent 70%);
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
    }
    #flash.active { opacity: 1; pointer-events: all; }

    /* ── tooltip hover ── */
    .nav-card::before {
      content: attr(data-tip);
      position: absolute;
      bottom: 110%;
      left: 50%; transform: translateX(-50%);
      background: rgba(7,4,26,0.9);
      border: 1px solid rgba(255,213,79,0.3);
      color: var(--gold-pale);
      font-family: 'Noto Serif SC', serif;
      font-size: 0.6rem;
      white-space: nowrap;
      padding: 3px 8px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .nav-card:hover::before { opacity: 1; }
  </style>
</head>

  </div>

</main>

<script>
// ── 光标跟随 ──
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});

// ── 星空背景 ──
const sf = document.getElementById('starfield');
const sctx = sf.getContext('2d');
let stars = [];

function resizeCanvas() {
  sf.width  = window.innerWidth;
  sf.height = window.innerHeight;
  const pc = document.getElementById('particles');
  pc.width  = window.innerWidth;
  pc.height = window.innerHeight;
}
window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
resizeCanvas();

function initStars() {
  stars = Array.from({length: 180}, () => ({
    x: Math.random() * sf.width,
    y: Math.random() * sf.height,
    r: Math.random() * 1.4 + 0.2,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.008 + 0.003,
    color: ['#ffffff','#ffd54f','#ff9ed2','#ce93d8'][Math.floor(Math.random()*4)]
  }));
}
initStars();

function drawStars(t) {
  sctx.clearRect(0, 0, sf.width, sf.height);
  stars.forEach(s => {
    const alpha = 0.35 + 0.6 * Math.abs(Math.sin(s.phase + t * s.speed));
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    sctx.fillStyle = s.color;
    sctx.globalAlpha = alpha;
    sctx.fill();
    if (s.r > 1) {
      sctx.globalAlpha = alpha * 0.3;
      sctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      sctx.fill();
    }
  });
  sctx.globalAlpha = 1;
}

// ── 鼠标粒子 ──
const pc = document.getElementById('particles');
const pctx = pc.getContext('2d');
let particles = [];
let lastMouse = {x: 0, y: 0};

document.addEventListener('mousemove', e => {
  lastMouse = {x: e.clientX, y: e.clientY};
  if (Math.random() < 0.5) spawnParticle(e.clientX, e.clientY);
});

const ICONS = ['✦','✧','★','◇','◆','·','⋆'];
function spawnParticle(x, y) {
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * 1.6,
    vy: (Math.random() - 1.2) * 1.4,
    life: 1,
    decay: Math.random() * 0.025 + 0.015,
    size: Math.random() * 10 + 6,
    icon: ICONS[Math.floor(Math.random() * ICONS.length)],
    color: ['#ffd54f','#ff9ed2','#ce93d8','#ffffff'][Math.floor(Math.random()*4)]
  });
}

function drawParticles() {
  pctx.clearRect(0, 0, pc.width, pc.height);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= p.decay;
    pctx.globalAlpha = p.life * 0.9;
    pctx.font = p.size + 'px serif';
    pctx.fillStyle = p.color;
    pctx.shadowColor = p.color;
    pctx.shadowBlur = 6;
    pctx.fillText(p.icon, p.x, p.y);
  });
  pctx.globalAlpha = 1;
  pctx.shadowBlur = 0;
}

// ── 点击爆炸粒子 ──
document.addEventListener('click', e => {
  for (let i = 0; i < 12; i++) spawnParticle(e.clientX, e.clientY);
});

// ── 主循环 ──
function loop(t) {
  drawStars(t * 0.001);
  drawParticles();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ── Enter 按钮闪光 ──
function handleEnter(e) {
  e.preventDefault();
  for (let i = 0; i < 20; i++) {
    setTimeout(() => spawnParticle(
      window.innerWidth / 2 + (Math.random()-0.5)*60,
      window.innerHeight / 2 + (Math.random()-0.5)*60
    ), i * 30);
  }
  const flash = document.getElementById('flash');
  flash.classList.add('active');
  setTimeout(() => {
    flash.classList.remove('active');
    // 目前 Enter 按钮无跳转，后续可指向主页内容
  }, 350);
}

// ── 阻止默认右键菜单（保持气氛） ──
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
